# The KQV study design: M0 to M3 on gender and disability, with tagged swaps
# and tagged control synonyms. Same setup as notebooks/bias_study.ipynb.
#   biascompare preview configs/study.yaml
#   biascompare run configs/study.yaml
dataset: ../data/sample_study.jsonl     # replace with your tagged ETHOS / ToxicCommons file
output: ../results/study.json
axes: [gender, disability]
task: toxicity
controls: tagged
comparisons: all-pairs
n_controls: 5
seed: 0

# Prompts and few-shot examples come from the data side: a prompts file with
# named prompts (here the placeholder sample). Models refer to them by name.
prompts: ../data/sample_prompts.yaml

models:
  - {id: M0, name: s-nlp/roberta_toxicity_classifier, prompt: instruction}
  - {id: M1, name: s-nlp/roberta_toxicity_classifier, prompt: few_shot}
  - {id: M2, name: unitary/toxic-bert, prompt: instruction}   # stand-in for your fine-tuned checkpoint
  - {id: M3, name: unitary/toxic-bert, prompt: few_shot}
